/* =====================================================
   CREATE UNIT MENU
===================================================== */

const unitsContainer = document.getElementById("unitsContainer");

accountingData.forEach((unitData, unitIndex) => {

    const unit = document.createElement("div");
    unit.className = "unit";

    const header = document.createElement("button");
    header.className = "unit-header";

    header.innerHTML = `
        <span>
            ${unitData.unit} – ${unitData.title}
            <span class="unit-info">
                ${unitData.hours} | Weightage: ${unitData.weightage} | ${unitData.co}
            </span>
        </span>
        <span class="arrow">▼</span>
    `;

    const topics = document.createElement("div");
    topics.className = "topics";

    unitData.topics.forEach((topic, topicIndex) => {

        const button = document.createElement("button");
        button.className = "topic-btn";
        button.textContent = "📖 " + topic.title;

        button.addEventListener("click", () => {

            document.querySelectorAll(".topic-btn").forEach(btn => {
                btn.classList.remove("active");
            });

            button.classList.add("active");

            showLecture(unitData, topic);

            if (window.innerWidth < 850) {
                document.getElementById("lectureContent")
                    .scrollIntoView({ behavior: "smooth" });
            }
        });

        topics.appendChild(button);
    });

    header.addEventListener("click", () => {
        unit.classList.toggle("open");
    });

    unit.appendChild(header);
    unit.appendChild(topics);
    unitsContainer.appendChild(unit);
});
